name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          python -m spacy download en_core_web_sm

      - name: Lint with ruff
        run: ruff check . --select E9,F63,F7,F82 --exit-zero
        # E9/F63/F7/F82: syntax errors + obvious bugs only. Full lint intentionally
        # not gated — the repo isn't ruff-clean yet.

      - name: Import smoke test
        run: |
          python -c "import redaction, state, retrieval, graph"

      - name: Run unit tests
        run: pytest tests/test_redaction.py -v
        # The end-to-end eval (tests/run_eval.py) is NOT run in CI — it needs
        # AWS Bedrock, OpenAI, Cohere, and S3 credentials. Run it locally with
        # `python tests/run_eval.py` before releases.
